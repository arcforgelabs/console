name: Release

# Push a tag such as v0.1.0, or run the workflow by hand with a version
# (it then tags the commit it built). This builds the commit on a
# GitHub-hosted runner and attaches the console bundle and the Keycloak
# theme JAR, each with a SHA-256 file, to a release. The platform repo pins
# the tag and the hashes; the deploy host never runs pnpm.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check version
        run: echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:worker
      - run: pnpm --filter @arcforgelabs/accounts-theme build:jar
      - name: Pack bundle
        run: |
          name="arcforge-console-${VERSION}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -czf "$name" dist dist-worker
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
          jar="arcforge-keycloak-theme-${VERSION}.jar"
          cp theme/dist_keycloak/arcforge-keycloak-theme.jar "$jar"
          sha256sum "$jar" > "$jar.sha256"
          cat "$jar.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "arcforge-console-${VERSION}.tar.gz" \
            "arcforge-console-${VERSION}.tar.gz.sha256" \
            "arcforge-keycloak-theme-${VERSION}.jar" \
            "arcforge-keycloak-theme-${VERSION}.jar.sha256" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes "Commit $GITHUB_SHA"
