name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHAs. This org rejects floating tags such as @v4.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:worker
      - run: pnpm test:browser:install
      - run: pnpm test:ui
      - run: pnpm build
      - run: pnpm build:worker
      # Keycloak login theme (needs Java and Maven, both on the runner).
      - run: pnpm --filter @arcforgelabs/accounts-theme build:jar
