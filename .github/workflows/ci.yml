name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHAs. This org rejects floating tags such as @v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:worker
      - run: pnpm test:browser:install
      - run: pnpm test:ui
      - run: pnpm build
      - run: pnpm build:worker
      # Keycloak login theme (needs Java and Maven, both on the runner).
      - run: pnpm --filter @arcforgelabs/accounts-theme build:jar
