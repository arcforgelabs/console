name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Playwright 1.59.1 cannot install Chromium on ubuntu-latest, now 26.04
    # (CI run 41455763933). Same pin as platform workflows.
    runs-on: ubuntu-24.04
    steps:
      # Full commit SHAs. This org rejects floating tags such as @v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:worker
      - run: pnpm test:browser:install
      - run: pnpm test:ui
      - run: pnpm build
      - run: pnpm build:worker
      # Keycloak login theme (needs Java and Maven, both on the runner).
      - run: pnpm --filter @arcforgelabs/accounts-theme build:jar
