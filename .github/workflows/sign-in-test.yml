name: Sign-in test

# Release tier (proof standard Rule 6): a real Keycloak 26.8.1 with the
# arcforge theme built from this commit, the realm in e2e/, and the console
# demo build. It runs before each release (release.yml calls it) and by hand.
# Pull request checks do not run it. No secret: the admin password is a
# throwaway value for this runner only.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The same image and digest as ansible/roles/keycloak in arcforgelabs/platform.
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.1-0@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
      KC_URL: http://localhost:8089
      KC_ADMIN_PASSWORD: local-test-only
    steps:
      # Full commit SHAs. This org rejects floating tags such as @v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arcforgelabs/accounts-theme build:jar
      - name: Start Keycloak with the theme and the test realm
        run: |
          docker run -d --name keycloak -p 8089:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KC_ADMIN_PASSWORD" \
            -v "$PWD/theme/dist_keycloak/arcforge-keycloak-theme.jar:/opt/keycloak/providers/arcforge-keycloak-theme.jar:ro" \
            -v "$PWD/e2e/realm-arcforge.json:/opt/keycloak/data/import/realm-arcforge.json:ro" \
            "$KEYCLOAK_IMAGE" start-dev --import-realm --health-enabled=true
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:sign-in
      - if: failure()
        run: docker logs keycloak
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sign-in-report
          path: |
            e2e/report
            e2e/results
          retention-days: 7
